<ng-container *ngIf="(authenticationService.isLoggedIn() | async)">
  <ng-container *ngIf="(userService.getUser() | async) as user">

    <button mat-button
            [matMenuTriggerFor]="menu"
            style="color: white; font-size: 20px; letter-spacing: normal"
    >
      <mat-icon id="anonymous-icon" *ngIf="user.isAnonymous"
                aria-label="Example icon-button with share icon">no_accounts
      </mat-icon>
      <span [attr.data-testid]="'navbar-username'">
        {{ user.name }}
      </span>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item
              (click)="router.navigate(['user-settings'])"
      >
        <mat-icon>settings</mat-icon>
        Settings
      </button>
      <button mat-menu-item (click)="authenticationService.logout()">
        <mat-icon>logout</mat-icon>
        logout
      </button>
    </mat-menu>
  </ng-container>
</ng-container>
{{ checkRender() }}
