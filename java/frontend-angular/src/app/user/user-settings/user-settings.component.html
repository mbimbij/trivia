<ng-container *ngIf="userService.getUser() | async as user">
  <div class="actions-section">
    <mat-form-field appearance="outline">
      <mat-label>User Name</mat-label>
      <input [id]="ids.userSettings.renameUser"
             [attr.data-testid]="ids.userSettings.renameUser"
             matInput
             [(ngModel)]="user.name"
             #userName="ngModel"
             notBlank
      >
      <mat-error *ngIf="userName.errors?.[ValidationErrorCodes.NOT_BLANK]">
        game name cannot be empty
      </mat-error>
    </mat-form-field>

    <mat-dialog-actions>
      <button
        class="rounded tonal-button"
        [id]="ids.userSettings.RESET"
        [attr.data-testid]="ids.userSettings.RESET"
        mat-stroked-button
      >Reset
      </button>
      <button
        class="rounded"
        [id]="ids.userSettings.SUBMIT"
        [attr.data-testid]="ids.userSettings.SUBMIT"
        mat-raised-button color="primary"
        [disabled]="(!!userName.errors)"
        mat-button (click)="userService.renameUser(userName.value)">Apply
      </button>
    </mat-dialog-actions>
  </div>
</ng-container>
{{ checkRender() }}
